services:
  - type: worker
    name: n8n-hosting-worker
    runtime: docker
    dockerfilePath: ./worker.Dockerfile
    dockerContext: .
    
    # Worker configuration
    plan: starter # Free tier available
    region: oregon # Choose your region
    
    # Build settings
    buildCommand: echo "Building worker..."
    
    # Environment variables
    envVars:
      - key: NODE_ENV
        value: production
      
      - key: DATABASE_URL
        sync: false # Set manually in Render dashboard
      
      - key: REDIS_HOST
        sync: false
      
      - key: REDIS_PORT
        value: 6379
      
      - key: REDIS_PASSWORD
        sync: false
      
      - key: AWS_REGION
        value: us-east-1 # Or your preferred region
      
      - key: AWS_ACCESS_KEY_ID
        sync: false
      
      - key: AWS_SECRET_ACCESS_KEY
        sync: false
      
      # Optional: if you need these
      - key: NEXTAUTH_SECRET
        sync: false
      
      - key: NEXTAUTH_URL
        sync: false
    
    # Auto-deploy
    autoDeploy: true
    
    # Health check
    healthCheckPath: /health